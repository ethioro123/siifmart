<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIIFMART component reference</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e9ee;color:#18212f;font:16px/1.5 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:28px;line-height:36px;letter-spacing:-.02em;margin:0 0 8px}h2{font-size:20px;line-height:28px;margin:0}h3{font-size:16px;line-height:24px;margin:0 0 12px}p{margin:0 0 16px}.boards{display:grid;grid-template-columns:1fr 1fr;gap:24px}.board{background:var(--canvas);color:var(--text);padding:24px;border-radius:18px;min-width:0}.board header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}.panel{background:var(--surface);border:1px solid var(--divider);border-radius:14px;padding:20px;margin-top:16px}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.muted{color:var(--muted)}.secondary{color:var(--secondary)}.eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;margin-bottom:8px}button,input{font:inherit}button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;line-height:20px;font-weight:600;cursor:pointer}button:hover:not(:disabled){background:var(--hover)}button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}button.primary:hover:not(:disabled){background:var(--primary-hover)}button:disabled{background:var(--surface);color:var(--muted);cursor:not-allowed}button[aria-busy=true]{cursor:progress}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}label{display:block;font-size:14px;line-height:20px;font-weight:500;margin-bottom:8px}input{display:block;width:100%;min-height:44px;padding:9px 12px;line-height:24px;font-weight:400;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px}input[aria-invalid=true]{border-color:var(--danger)}.help{font-size:14px;line-height:20px;margin:8px 0 20px}.error{color:var(--danger)}.badge{display:inline-flex;align-items:center;min-height:24px;padding:4px 8px;border-radius:999px;font-size:12px;line-height:16px;font-weight:600}.success{background:var(--success-bg);color:var(--success)}.warning{background:var(--warning-bg);color:var(--warning)}.danger{background:var(--danger-bg);color:var(--danger)}.selected{background:var(--selected)}.count{font-variant-numeric:tabular-nums;font-weight:600}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px;line-height:20px}th{font-weight:600;height:44px}th,td{padding:12px 16px;border-bottom:1px solid var(--divider)}td{height:52px}th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{padding-right:0;text-align:right;font-variant-numeric:tabular-nums}small{display:block;font-size:12px;line-height:16px;margin-top:4px}.space{margin-top:20px}dialog{width:min(560px,calc(100% - 32px));padding:24px;border:1px solid #798493;border-radius:18px;color:#18212f;background:white}dialog::backdrop{background:rgb(17 19 24 / .55)}dialog h2{margin-bottom:16px}dialog button{background:#18212f;color:white;border-color:#18212f}dialog button:focus-visible{outline:2px solid #175cd3;outline-offset:2px}@media(max-width:959px){.boards{grid-template-columns:1fr}}@media(max-width:599px){main{padding:16px}.board{padding:16px}.panel{padding:16px}h1{font-size:24px;line-height:32px}}@media(forced-colors:active){button,input,.panel{border-color:ButtonText}:focus-visible{outline-color:Highlight}.badge{border:1px solid CanvasText}}
</style></head><body><main><h1>Precision, without noise.</h1><p>SIIFMART design reference · Revision B · 29 October 2026. Synthetic examples only; these controls never change business data.</p><div class="boards"></div></main>
<template id="board"><section class="board"><header><div><p class="eyebrow secondary">COMPONENT REFERENCE</p><h2></h2></div><button class="review" aria-label="Review 12 example product approvals">Approvals <span class="count">12</span></button></header>
<section class="panel"><h3>One clear next action</h3><p class="secondary">Quiet surfaces. Readable evidence. Deliberate detail.</p><div class="row"><button class="primary review">Review proposal</button><button>Save draft example</button><button disabled>Unavailable action</button><button aria-busy="true" disabled>Submitting example…</button></div></section>
<section class="panel"><h3>Labels remain visible</h3><label>Display site code<input value="ADD-DC-01" readonly></label><p class="help secondary">Addis Ababa Distribution Center · Read-only reference</p><label>Proposed selling price<input inputmode="numeric" value="0" aria-invalid="true"></label><p class="help error">Enter a positive whole-number selling price.</p><div class="row"><span class="badge success">Applied</span><span class="badge warning">Awaiting clearance</span><span class="badge danger">Needs correction</span></div></section>
<section class="panel"><h3>Care Diaper · ETBB002</h3><p class="secondary">ADD regional scope · 12 locations · One proposal</p><div class="table-wrap"><table><caption class="secondary" style="text-align:left;padding-bottom:12px">Example location prices · ETB</caption><thead><tr><th>Location</th><th>Status</th><th>Proposed</th></tr></thead><tbody><tr class="selected"><td><strong>Selected example</strong><small>ADD-DC-01</small></td><td>Pending review</td><td>1,500</td></tr><tr><td><strong>Central Store</strong><small>ADD-STR-02</small></td><td>Pending review</td><td>1,500</td></tr></tbody></table></div><p class="help muted">No live prices are displayed or changed.</p></section></section></template>
<dialog aria-labelledby="review-title"><h2 id="review-title">Reference review</h2><p>This demonstrates a focused review dialog. No production proposal is loaded and no approval will be recorded.</p><form method="dialog"><button autofocus>Close example review</button></form></dialog>
<script id="reference-palette" type="application/json">
{"light":{"canvas":"#F6F7F9","surface":"#FFFFFF","hover":"#EEF1F5","text":"#18212F","secondary":"#4B5563","muted":"#596579","border":"#798493","divider":"#D9DEE7","accent":"#175CD3","primary":"#18212F","on-primary":"#FFFFFF","primary-hover":"#273444","selected":"#EDF3FF","danger":"#B42318","danger-bg":"#FEF3F2","success":"#166534","success-bg":"#F0FDF4","warning":"#854D0E","warning-bg":"#FEFCE8"},"dark":{"canvas":"#111318","surface":"#1B1F27","hover":"#262D38","text":"#F3F4F6","secondary":"#C2C8D2","muted":"#A3ADBC","border":"#788393","divider":"#394150","accent":"#8AB4FF","primary":"#F3F4F6","on-primary":"#111318","primary-hover":"#DDE3EC","selected":"#23344F","danger":"#FDA29B","danger-bg":"#341C1F","success":"#86EFAC","success-bg":"#142B1C","warning":"#FDE68A","warning-bg":"#302714"}}
</script><script>
const palette=JSON.parse(document.getElementById('reference-palette').textContent);
for(const [theme,roles] of Object.entries(palette)){const fragment=document.getElementById('board').content.cloneNode(true);const board=fragment.querySelector('.board');board.dataset.theme=theme;for(const [name,value]of Object.entries(roles))board.style.setProperty('--'+name,value);board.querySelector('h2').textContent=theme==='light'?'Light · Comfortable':'Dark · Comfortable';const labels=board.querySelectorAll('label');labels.forEach((label,i)=>{const input=label.querySelector('input');input.id=theme+'-field-'+i;label.htmlFor=input.id;const help=label.nextElementSibling;help.id=input.id+'-help';input.setAttribute('aria-describedby',help.id)});document.querySelector('.boards').append(fragment)}
const dialog=document.querySelector('dialog');let opener;document.querySelectorAll('.review').forEach(button=>button.addEventListener('click',()=>{opener=button;dialog.showModal()}));dialog.addEventListener('close',()=>opener?.focus());document.body.dataset.ready='true';
</script></body></html>
