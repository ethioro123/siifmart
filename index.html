<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    let savedTheme = null;
    try {
      savedTheme = window.localStorage.getItem('siifmart_theme_preference');
    } catch {}
    const systemPrefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
    const initialTheme = savedTheme === 'dark' || savedTheme === 'light'
      ? savedTheme
      : systemPrefersDark ? 'dark' : 'light';
    document.documentElement.dataset.theme = initialTheme;
    document.documentElement.style.colorScheme = initialTheme;
    document.documentElement.classList.toggle('dark', initialTheme === 'dark');
  </script>
  <link rel="stylesheet" href="/brand-boot.css" />
  <title>SIIFMART | Retail & Warehouse System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root">
    <div class="brand-boot" role="status" aria-label="SIIFMART">
      <div class="brand-boot__aura" aria-hidden="true"></div>
      <div class="brand-boot__content">
        <div class="brand-boot__identity">
          <span class="brand-boot__static-mark" aria-hidden="true"></span>
          <span class="brand-boot__static-name">SIIFMART</span>
        </div>
        <div class="brand-boot__loading" aria-hidden="true"><div class="brand-boot__track"><span></span></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
