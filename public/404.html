<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SIIFMART | Retail & Warehouse System</title>
  <link rel="stylesheet" href="/fallback.css" />
  <script>
    // Cloudflare Pages / Static Hosting SPA fallback redirect
    // Seamlessly preserve path & query params for client-side routing
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      if (path && path !== '/' && path !== '/index.html') {
        window.location.replace('/#' + path + (search || ''));
      } else {
        window.location.replace('/' + (hash || '') + (search || ''));
      }
    })();
  </script>
</head>
<body>
  <div class="fallback-container">
    <div class="spinner"></div>
    <p class="fallback-text">Routing to SIIFMART...</p>
  </div>
</body>
</html>
