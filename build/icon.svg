<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="100" y1="80" x2="924" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3F27"/>
      <stop offset="50%" stop-color="#2C5E3B"/>
      <stop offset="100%" stop-color="#15261B"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="200" y1="100" x2="824" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="emblemGrad" x1="256" y1="256" x2="768" y2="768" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="544" y1="256" x2="768" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#bgGrad)"/>
  <rect x="36" y="36" width="952" height="952" rx="236" stroke="url(#rimGrad)" stroke-width="8" fill="none"/>

  <!-- Core Emblem Graphic: Modern 4-quadrant smart-retail & warehouse grid -->
  <!-- Top-Left Main Cube -->
  <rect x="264" y="264" width="216" height="216" rx="44" fill="url(#emblemGrad)"/>
  
  <!-- Top-Right Accent Cube (Warm Amber/Gold) -->
  <rect x="544" y="264" width="216" height="216" rx="44" fill="url(#goldGrad)"/>
  
  <!-- Bottom-Left Accent Cube (Deep Emerald) -->
  <rect x="264" y="544" width="216" height="216" rx="44" fill="#10B981"/>
  
  <!-- Bottom-Right Main Cube -->
  <rect x="544" y="544" width="216" height="216" rx="44" fill="url(#emblemGrad)"/>

  <!-- Dynamic Interconnecting Center Nexus -->
  <circle cx="512" cy="512" r="64" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="38" fill="#1E3F27"/>
  <circle cx="512" cy="512" r="20" fill="#00FF9D"/>
</svg>